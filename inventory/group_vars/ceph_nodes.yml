---
# Ceph nodes have no provider NIC
provider_interface: null

# =============================================================================
# Ceph cluster as code (playbooks/ceph-cluster.yml, playbooks/ceph-pools.yml)
# Per-host cephadm labels are `ceph_labels` in inventory/hosts.yml.
# =============================================================================

# Release the cluster runs: download.ceph.com repo + cephadm / ceph-common on
# the nodes (ceph-prereqs.yml). ceph-upgrade.yml moves the cluster one release
# up and then asks to change this line (reef 18.2 -> squid 19.2 -> tentacle 20.2).
ceph_release: tentacle

# Target version of each release for ceph-upgrade.yml (-e ceph_upgrade_to=...)
ceph_upgrade_versions:
  squid: 19.2.7
  tentacle: 20.2.5

# Node that runs `ceph` commands (bootstrapped first, holds the admin keyring).
# Plays default to ceph01 in `hosts:`: keep them in step if this changes.
ceph_admin_host: ceph01

# OSDs: every empty disk on every host, now and later (runbook option A).
# ceph-cluster.yml waits for this many OSDs before creating the pools.
ceph_osd_all_available_devices: true
ceph_osd_expected: 6

# Central config database (`ceph config set`), ceph-cluster.yml --tags config.
# Values as `ceph config dump` stores them (sizes in bytes).
# OSD memory: each VM has 7.7 GiB for 2 OSDs + MON (+ MGR, RGW). cephadm's
# autotuning gave ceph03 ~1.1 GiB per OSD but left ceph01/ceph02 at the 4 GiB
# default (8 GiB of OSD cache on a 7.7 GiB VM). Fixed instead: 2 x 1.5 GiB.
# The role also drops autotuning's per-host osd/host:<node> values.
ceph_config:
  - { who: osd, name: osd_memory_target_autotune, value: "false" }
  - { who: osd, name: osd_memory_target, value: "1610612736" }   # 1.5 GiB

# Object storage (RGW, S3), standalone: local RGW users, no Keystone.
# ceph-cluster.yml --tags rgw. Gateways run on the hosts labelled `rgw` in
# hosts.yml. Clients use only the ingress VIP on the management network (the
# client network); haproxy forwards to the gateways, which listen on the
# storage network: the dashboard reaches RGW at the daemons' Ceph public
# address (storage IP) and Reef has no setting to point it elsewhere.
ceph_rgw_enabled: true
ceph_rgw_service_id: s3                        # cephadm service rgw.s3
ceph_rgw_port: 8080                            # each gateway, on its storage IP
ceph_rgw_networks: ["{{ storage_network }}"]
ceph_rgw_realm: homelab                        # pools are named <zone>.rgw.*
ceph_rgw_zonegroup: homelab
ceph_rgw_zone: homelab-a
ceph_rgw_ingress_enabled: true                 # clients use http://<vip>:<frontend port>
ceph_rgw_vip: 10.0.0.150
ceph_rgw_vip_prefix: 24
ceph_rgw_frontend_port: 80
ceph_rgw_monitor_port: 1967                    # haproxy status page

# Health checks muted on purpose (ceph-cluster.yml --tags config, sticky).
# Squid 19.2.6+ (CVE-2025-30156) flags CephX keys of type "aes". cephadm moved
# the daemon keys to aes256k; client keys stay "aes" (auth_preferred_cipher
# aes, aes still allowed) until OpenStack's librbd is known to support
# aes256k: rotating client.glance / client.cinder or disallowing aes could lock
# OpenStack out. Remove these once the client keys are rotated
# (ceph/OPERATIONS.md, Upgrades). AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE
# clears by itself within ~1 h of the upgrade.
ceph_health_mutes:
  - { code: AUTH_INSECURE_CLIENT_KEY_TYPE, why: "client keys still aes, OpenStack librbd not confirmed for aes256k" }
  - { code: AUTH_INSECURE_KEYS_ALLOWED, why: "aes kept allowed for those client keys" }
  - { code: AUTH_INSECURE_KEYS_CREATABLE, why: "follows from aes allowed" }

# RBD pools for OpenStack: 3 copies (one per host), I/O continues with 2
ceph_pools:
  - { name: images, pg_num: 32, size: 3, min_size: 2, application: rbd }    # Glance
  - { name: volumes, pg_num: 32, size: 3, min_size: 2, application: rbd }   # Cinder
  - { name: vms, pg_num: 32, size: 3, min_size: 2, application: rbd }       # Nova ephemeral disks

# CephX users. Nova reuses client.cinder (vms + copy-on-write clones of images).
ceph_clients:
  - name: client.glance
    caps:
      mon: profile rbd
      osd: profile rbd pool=images
      mgr: profile rbd pool=images
  - name: client.cinder
    caps:
      mon: profile rbd
      osd: profile rbd pool=volumes, profile rbd pool=vms, profile rbd-read-only pool=images
      mgr: profile rbd pool=volumes, profile rbd pool=vms

# Keyrings written on the deploy VM for Kolla (paths under /etc/kolla)
ceph_kolla_keyrings:
  - { client: client.glance, dest: config/glance/ceph.client.glance.keyring }
  - { client: client.cinder, dest: config/cinder/cinder-volume/ceph.client.cinder.keyring }
  - { client: client.cinder, dest: config/nova/ceph.client.cinder.keyring }

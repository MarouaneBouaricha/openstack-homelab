# =============================================================================
# OpenStack homelab — base inventory
# ansible_host = management IP (10.0.0.0/24)
# storage_ip   = storage IP    (10.0.2.0/24)
# Kolla-Ansible's own multinode inventory will be derived from these groups.
# =============================================================================
all:
  children:
    deployment:
      hosts:
        deploy:
          ansible_host: 10.0.0.10
          ansible_connection: local

    openstack:
      children:
        control:
          hosts:
            controller:
              ansible_host: 10.0.0.20
              storage_ip: 10.0.2.20
        network:
          hosts:
            controller:
        compute:
          hosts:
            compute01:
              ansible_host: 10.0.0.30
              storage_ip: 10.0.2.30
            compute02:
              ansible_host: 10.0.0.40
              storage_ip: 10.0.2.40
        monitoring:
          hosts:
            controller:

    ceph:
      hosts:
        ceph:
          ansible_host: 10.0.0.50
          storage_ip: 10.0.2.50

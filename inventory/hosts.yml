# =============================================================================
# OpenStack homelab — base inventory
# Hosts are reached by NAME: playbooks/etc-hosts.yml writes these names into
# /etc/hosts on every node (deploy VM included), so no ansible_host is needed.
#   mgmt_ip    = management IP (10.0.0.0/24)
#   storage_ip = storage IP    (10.0.2.0/24)
# Kolla-Ansible's own multinode inventory will be derived from these groups.
# =============================================================================
all:
  children:
    deployment:
      hosts:
        deploy:
          mgmt_ip: 10.0.0.10
          ansible_connection: local

    openstack:
      children:
        control:
          hosts:
            controller:
              mgmt_ip: 10.0.0.20
              storage_ip: 10.0.2.20
        network:
          hosts:
            controller:
        compute:
          hosts:
            compute01:
              mgmt_ip: 10.0.0.30
              storage_ip: 10.0.2.30
            compute02:
              mgmt_ip: 10.0.0.40
              storage_ip: 10.0.2.40
        monitoring:
          hosts:
            controller:

    ceph_nodes:
      hosts:
        ceph01:
          mgmt_ip: 10.0.0.50
          storage_ip: 10.0.2.50
        ceph02:
          mgmt_ip: 10.0.0.60
          storage_ip: 10.0.2.60
        ceph03:
          mgmt_ip: 10.0.0.70
          storage_ip: 10.0.2.70

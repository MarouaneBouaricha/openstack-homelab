# =============================================================================
# Netplan — ceph02
# Source of truth for /etc/netplan/01-homelab.yaml on host "ceph02"
# Interfaces are matched by MAC and renamed (set-name); new names apply on
# reboot. Cloned from ceph01: the NAT MAC is set by hand in VMware (it was a
# static duplicate of ceph01's).
# Applied by: ansible-playbook playbooks/preconfig.yml --tags netif -K
# =============================================================================
network:
  version: 2
  renderer: networkd
  ethernets:
    # --- NAT — internet access (VMware Workstation NAT, DHCP) -- was ens33 --
    # Provides the default route and DNS.
    nat01:
      match:
        macaddress: "00:50:56:28:6c:e3"
      set-name: nat01
      dhcp4: true
      dhcp6: false

    # --- (1) Management network — 10.0.0.0/24 -------------------- was ens37 --
    mgmt01:
      match:
        macaddress: "00:0c:29:46:a0:58"
      set-name: mgmt01
      dhcp4: false
      dhcp6: false
      addresses:
        - 10.0.0.60/24

    # --- (3) Storage network — 10.0.2.0/24 (Ceph) ---------------- was ens38 --
    stor01:
      match:
        macaddress: "00:0c:29:46:a0:62"
      set-name: stor01
      dhcp4: false
      dhcp6: false
      addresses:
        - 10.0.2.60/24

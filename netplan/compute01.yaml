# =============================================================================
# Netplan — compute01
# Source of truth for /etc/netplan/01-homelab.yaml on host "compute01"
# Interfaces are matched by MAC and renamed (set-name); new names apply on
# reboot. Applied by: ansible-playbook playbooks/preconfig.yml --tags netif -K
# =============================================================================
network:
  version: 2
  renderer: networkd
  ethernets:
    # --- NAT — internet access (VMware Workstation NAT, DHCP) -- was ens33 --
    # Provides the default route and DNS.
    nat01:
      match:
        macaddress: "00:50:56:3c:5c:e9"
      set-name: nat01
      dhcp4: true
      dhcp6: false

    # --- (1) Management network — 10.0.0.0/24 -------------------- was ens37 --
    mgmt01:
      match:
        macaddress: "00:0c:29:de:7e:c0"
      set-name: mgmt01
      dhcp4: false
      dhcp6: false
      addresses:
        - 10.0.0.30/24

    # --- (2) Provider network — NO IP (Neutron external) --------- was ens39 --
    prov01:
      match:
        macaddress: "00:0c:29:de:7e:d4"
      set-name: prov01
      dhcp4: false
      dhcp6: false
      link-local: []

    # --- (3) Storage network — 10.0.2.0/24 (Ceph) ---------------- was ens38 --
    stor01:
      match:
        macaddress: "00:0c:29:de:7e:ca"
      set-name: stor01
      dhcp4: false
      dhcp6: false
      addresses:
        - 10.0.2.30/24

---
# =============================================================================
# Name resolution for the lab
#   - sets each VM's hostname
#   - writes every node's management IP + name into /etc/hosts
#   - drops the "127.0.1.1 <hostname>" line (Kolla/RabbitMQ need the
#     hostname to resolve to the management IP, not loopback)
#   - on the deploy VM: trusts every node's SSH host key by name and adds an
#     ~/.ssh/config so `ssh controller` just works
#
# Run from the repo root on the deploy VM:
#   ansible-playbook playbooks/etc-hosts.yml -K
#
# The deploy VM runs first: once its /etc/hosts is written, Ansible can reach
# the other nodes by name.
# =============================================================================

- name: Configure name resolution on the deploy VM
  hosts: deployment
  become: true
  tasks:
    - name: Set hostname, /etc/hosts
      ansible.builtin.import_tasks: tasks/etc-hosts.yml

- name: Configure name resolution on all other nodes
  hosts: all:!deployment
  become: true
  tasks:
    - name: Set hostname, /etc/hosts
      ansible.builtin.import_tasks: tasks/etc-hosts.yml

- name: SSH client config on the deploy VM
  hosts: deployment
  become: false
  vars:
    ssh_nodes: "{{ groups['all'] | difference(['deploy']) }}"
  tasks:
    - name: Scan SSH host keys by name and IP
      ansible.builtin.command: >-
        ssh-keyscan -T 5 -t ed25519
        {{ item }},{{ hostvars[item].mgmt_ip }}
      loop: "{{ ssh_nodes }}"
      register: keyscan
      changed_when: false

    - name: Trust host keys (name + IP)
      ansible.builtin.known_hosts:
        path: ~/.ssh/known_hosts
        name: "{{ item.item }}"
        key: "{{ item.stdout_lines | select('match', '^[^#]') | first }}"
      loop: "{{ keyscan.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: SSH client config for lab nodes
      ansible.builtin.blockinfile:
        path: ~/.ssh/config
        create: true
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED — openstack-homelab"
        block: |
          Host {{ ssh_nodes | join(' ') }}
              User {{ ansible_user }}
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes

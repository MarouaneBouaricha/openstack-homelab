---
# =============================================================================
# Lab health check: read-only, run it before and after every change
#
#   nodes      every host: reachable, chrony offset < 0.05 s, / free space,
#              renamed NICs up, management/storage IPs, pending reboot (warning)
#   ceph       on the Ceph admin node: HEALTH_OK, MON quorum, OSDs up/in,
#              PGs active+clean, fullest OSD < 40%, cephadm daemons running,
#              new crashes (warning)
#   openstack  Kolla containers running and healthy on the OpenStack nodes;
#              from the deploy VM: Keystone on the VIP, compute services,
#              network agents and volume services up
#   (always)   one PASS/WARN/FAIL table; the run fails if any check failed
#
# Changes nothing (also safe with --check). No -K: sudo is passwordless on the
# nodes and the deploy VM part needs no root.
#
# Run from the repo root on the deploy VM:
#   ansible-playbook playbooks/health.yml
#   ansible-playbook playbooks/health.yml --tags ceph
# =============================================================================
- name: Health | nodes
  hosts: all
  become: false
  gather_facts: false
  tags: [nodes]
  tasks:
    - name: Node checks
      ansible.builtin.import_role:
        name: health
        tasks_from: nodes

- name: Health | Ceph
  hosts: "{{ ceph_admin_host | default('ceph01') }}"
  become: true
  gather_facts: false
  tags: [ceph]
  tasks:
    - name: Ceph checks
      ansible.builtin.import_role:
        name: health
        tasks_from: ceph

- name: Health | Kolla containers
  hosts: openstack
  become: true
  gather_facts: false
  tags: [openstack]
  tasks:
    - name: Container checks
      ansible.builtin.import_role:
        name: health
        tasks_from: containers

- name: Health | OpenStack APIs
  hosts: deployment
  become: false
  gather_facts: false
  tags: [openstack]
  tasks:
    - name: API checks
      ansible.builtin.import_role:
        name: health
        tasks_from: openstack

- name: Health | report
  hosts: deployment
  become: false
  gather_facts: false
  tags: [always]
  tasks:
    - name: Report
      ansible.builtin.import_role:
        name: health
        tasks_from: report

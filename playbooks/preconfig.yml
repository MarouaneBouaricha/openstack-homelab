---
# =============================================================================
# Node pre-configuration (run before Kolla-Ansible / Ceph)
#
#   hosts  hostnames, /etc/hosts, SSH known_hosts + config by name; on cloned
#          VMs, fresh machine-id + SSH host keys first (also: --tags clone)
#   netif  rename NICs by MAC (nat01, mgmt01, stor01, prov01) from netplan/.
#          Reboots nodes ONE AT A TIME. The deploy VM is not rebooted:
#          reboot it by hand afterwards.
#   ntp    chrony: the deploy VM serves time, every other node follows it
#   sudo   passwordless sudo for ansible_user on every node except the deploy
#          VM (Kolla-Ansible bootstrap-servers/deploy need it)
#
# Run from the repo root on the deploy VM:
#   ansible-playbook playbooks/preconfig.yml -K                 # everything
#   ansible-playbook playbooks/preconfig.yml -K --tags ntp      # one part
# =============================================================================

# --- sudo --------------------------------------------------------------------
# First, so the plays below (and Kolla-Ansible) no longer need the password
# on these nodes.
# No facts needed: one sudoers file per node, so a slow or overloaded node
# doesn't hold up the others during fact gathering.
- name: Passwordless sudo | other nodes
  hosts: all:!deployment
  become: true
  gather_facts: false
  tags: [sudo]
  roles: [sudo_nopasswd]

# --- hosts -------------------------------------------------------------------
# Deploy VM first: once its /etc/hosts is written, the rest are reachable by name.
- name: Name resolution | deploy VM
  hosts: deployment
  become: true
  tags: [hosts]
  roles: [etc_hosts]

# Cloned VMs: new machine-id + SSH host keys BEFORE the host keys are scanned
# below. Only touches hosts that share a machine-id with an earlier host.
- name: Clone identity | other nodes
  hosts: all:!deployment
  become: true
  tags: [hosts, clone]
  roles: [clone_identity]

- name: Name resolution | other nodes
  hosts: all:!deployment
  become: true
  tags: [hosts]
  roles: [etc_hosts]

- name: SSH client config | deploy VM
  hosts: deployment
  become: false
  tags: [hosts]
  vars:
    ssh_client_nodes: "{{ groups['all'] | difference(groups['deployment']) }}"
  roles: [ssh_client]

# --- netif -------------------------------------------------------------------
- name: Rename interfaces | other nodes, one at a time
  hosts: all:!deployment
  become: true
  serial: 1
  tags: [netif]
  roles: [netif_rename]

- name: Rename interfaces | deploy VM (no automatic reboot)
  hosts: deployment
  become: true
  tags: [netif]
  vars:
    netif_reboot: false
  roles: [netif_rename]

# --- ntp ---------------------------------------------------------------------
- name: Time sync | server
  hosts: deployment
  become: true
  tags: [ntp]
  roles: [chrony]

- name: Time sync | clients
  hosts: all:!deployment
  become: true
  tags: [ntp]
  roles: [chrony]

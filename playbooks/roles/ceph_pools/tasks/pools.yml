---
# Create missing pools, then converge size / min_size / application.
# `rbd pool init` runs only on pools created by this run.

- name: Pools | list existing pools
  ansible.builtin.command: ceph osd pool ls -f json
  register: ceph_pools_existing
  changed_when: false
  check_mode: false

- name: Pools | create missing pools
  ansible.builtin.command: ceph osd pool create {{ item.name }} {{ item.pg_num }}
  loop: "{{ ceph_pools | rejectattr('name', 'in', ceph_pools_existing.stdout | from_json) | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: ceph_pools_created
  changed_when: true

- name: Pools | read size and min_size
  ansible.builtin.command: ceph osd pool get {{ item.0.name }} {{ item.1 }} -f json
  loop: "{{ ceph_pools | product(['size', 'min_size']) | list }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
  register: ceph_pools_props
  changed_when: false
  failed_when: false
  check_mode: false

# A pool that does not exist yet (check mode) reads as rc != 0: would be set
- name: Pools | set size and min_size
  ansible.builtin.command: >-
    ceph osd pool set {{ item.item.0.name }} {{ item.item.1 }} {{ item.item.0[item.item.1] }}
  loop: "{{ ceph_pools_props.results }}"
  loop_control:
    label: "{{ item.item.0.name }} {{ item.item.1 }}={{ item.item.0[item.item.1] }}"
  when: >-
    item.rc != 0
    or (item.stdout | from_json)[item.item.1] | int != item.item.0[item.item.1] | int
  changed_when: true

- name: Pools | read applications
  ansible.builtin.command: ceph osd pool application get {{ item.name }} -f json
  loop: "{{ ceph_pools }}"
  loop_control:
    label: "{{ item.name }}"
  register: ceph_pools_apps
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pools | enable the application
  ansible.builtin.command: ceph osd pool application enable {{ item.item.name }} {{ item.item.application }}
  loop: "{{ ceph_pools_apps.results }}"
  loop_control:
    label: "{{ item.item.name }} {{ item.item.application }}"
  when: item.rc != 0 or item.item.application not in (item.stdout | from_json)
  changed_when: true

- name: Pools | initialize new RBD pools
  ansible.builtin.command: rbd pool init {{ item.item.name }}
  loop: "{{ ceph_pools_created.results | default([]) | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.item.application == 'rbd'
  changed_when: true

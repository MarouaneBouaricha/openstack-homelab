---
# --- apt update && apt upgrade -y ---------------------------------------------
- name: Update package lists and upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: "yes"
  tags: [upgrade]

# --- base tools -----------------------------------------------------------------
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ ceph_base_packages }}"
    state: present

# --- Docker (container runtime for cephadm) ------------------------------------
- name: Install Docker
  ansible.builtin.apt:
    name: "{{ ceph_container_packages }}"
    state: present
  tags: [docker]

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: [docker]

# --- Ceph repository (signed-by keyring; apt-key is deprecated) + cephadm, CLI --
- name: Ceph repository and packages
  ansible.builtin.import_tasks: repo.yml
  tags: [cephadm]

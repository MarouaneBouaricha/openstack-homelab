---
# Render one spec file (ceph_spec_src -> ceph_spec_dest) and `ceph orch apply`
# it when it changed (or ceph_spec_force), after saving the cluster's current
# specs. Used for cluster-spec.yml (this role) and rgw-spec.yml (ceph_rgw).

- name: Specs | render {{ ceph_spec_dest | basename }}
  ansible.builtin.template:
    src: "{{ ceph_spec_src }}"
    dest: "{{ ceph_spec_dest }}"
    owner: root
    group: root
    mode: "0644"
  register: ceph_spec_file

- name: Specs | apply {{ ceph_spec_dest | basename }}
  when:
    - ceph_spec_file is changed or ceph_spec_force | bool
    - not ansible_check_mode
  block:
    - name: Specs | backup directory
      ansible.builtin.file:
        path: "{{ ceph_spec_backup_dir }}"
        state: directory
        mode: "0700"

    - name: Specs | save the current specs (ceph orch ls --export)
      ansible.builtin.shell: >-
        ceph orch ls --export > {{ ceph_spec_backup_dir }}/specs-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-{{
        ceph_spec_dest | basename | splitext | first }}.yml
      changed_when: true

    - name: Specs | dry run
      ansible.builtin.command: ceph orch apply -i {{ ceph_spec_dest }} --dry-run
      register: ceph_spec_dry_run
      changed_when: false

    - name: Specs | dry run output
      ansible.builtin.debug:
        msg: "{{ ceph_spec_dry_run.stdout_lines }}"

    # cephadm's serve loop can still be working on the specs it read before
    # this apply and save those back over the new ones (seen on Reef 18.2.8:
    # RgwService.config() re-saves the rgw.s3 spec it was handed, undoing a
    # networks change). Re-apply until the stored specs stay unchanged for
    # ceph_spec_settle_delay seconds.
    - name: Specs | ceph orch apply (re-applied until cephadm keeps it)
      ansible.builtin.shell: |
        for i in $(seq {{ ceph_spec_apply_attempts }}); do
          ceph orch apply -i {{ ceph_spec_dest }} || exit 1
          before=$(ceph orch ls --export) || exit 1
          sleep {{ ceph_spec_settle_delay }}
          after=$(ceph orch ls --export) || exit 1
          if [ "$before" = "$after" ]; then
            echo "kept after attempt $i"
            exit 0
          fi
          echo "cephadm changed the stored specs after attempt $i, re-applying"
        done
        echo "the stored specs kept changing after {{ ceph_spec_apply_attempts }} attempts" >&2
        exit 1
      args:
        executable: /bin/bash
      register: ceph_spec_apply
      changed_when: true

    - name: Specs | apply output
      ansible.builtin.debug:
        msg: "{{ ceph_spec_apply.stdout_lines }}"

---
# After `ceph orch upgrade start`, or on a re-run when cephadm already went on
# alone: wait, verify, then restore what the upgrade changes (PG autoscaler,
# health mutes). Safe to run on a cluster that is already upgraded.

# Matched as text, not parsed: during MGR failovers the command can return
# rc 0 with an empty answer (retried), and when nothing runs Tentacle prints
# "There are no upgrades in progress currently." instead of JSON.
- name: Finish | wait for cephadm (follow it with `ceph -W cephadm` on ceph01)
  ansible.builtin.command: ceph orch upgrade status -f json
  register: ceph_upgrade_progress
  changed_when: false
  failed_when: false
  retries: "{{ ceph_upgrade_wait_retries }}"
  delay: "{{ ceph_upgrade_wait_delay }}"
  until: >-
    ceph_upgrade_progress.rc == 0
    and (ceph_upgrade_progress.stdout is search('"in_progress": ?false|no upgrades? in progress')
         or ceph_upgrade_progress.stdout is search('"is_paused": ?true'))

- name: Finish | cephadm finished without pausing
  ansible.builtin.assert:
    that:
      - ceph_upgrade_progress.stdout is search('"in_progress": ?false|no upgrades? in progress')
    fail_msg: >-
      cephadm paused or stopped the upgrade: {{ ceph_upgrade_progress.stdout | default('') }}.
      See `ceph health detail` (UPGRADE_* alerts) and `ceph log last 50 info cephadm`, fix,
      then `ceph orch upgrade resume` or re-run this playbook. The PG autoscaler stays paused.
    quiet: true

- name: Finish | every daemon on the target
  ansible.builtin.command: ceph versions -f json
  register: ceph_upgrade_versions_after
  changed_when: false
  retries: 30
  delay: 10
  until: >-
    ceph_upgrade_versions_after.stdout | regex_findall('ceph version ([0-9.]+)') | unique
    == [ceph_upgrade_target]

# cephadm normally sets it once the last OSD is upgraded. Cannot be undone.
- name: Finish | read require_osd_release
  ansible.builtin.command: ceph osd dump -f json
  register: ceph_upgrade_osd_dump
  changed_when: false

- name: Finish | require_osd_release {{ ceph_upgrade_to }}
  ansible.builtin.command: ceph osd require-osd-release {{ ceph_upgrade_to }}
  changed_when: true
  when: (ceph_upgrade_osd_dump.stdout | from_json).require_osd_release != ceph_upgrade_to

- name: Finish | read the PG autoscaler flag
  ansible.builtin.command: ceph osd pool get noautoscale
  register: ceph_upgrade_noautoscale
  changed_when: false

- name: Finish | resume the PG autoscaler
  ansible.builtin.command: ceph osd pool unset noautoscale
  changed_when: true
  when: "'is on' in ceph_upgrade_noautoscale.stdout"

# cephadm mutes the AUTH_INSECURE_* checks while it upgrades and unmutes all
# of them when it completes, including the sticky ones from ceph_health_mutes
- name: Finish | re-apply ceph_config and the health mutes
  ansible.builtin.include_role:
    name: ceph_config

- name: Finish | wait for HEALTH_OK
  ansible.builtin.command: ceph health -f json
  register: ceph_upgrade_health_after
  changed_when: false
  retries: "{{ ceph_upgrade_health_retries }}"
  delay: "{{ ceph_upgrade_health_delay }}"
  until: >-
    ceph_upgrade_health_after.stdout is search('"status": ?"HEALTH_OK"')

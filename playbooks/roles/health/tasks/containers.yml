---
# OpenStack nodes: every Kolla container running and not unhealthy.

- name: Containers | reachable
  ansible.builtin.import_tasks: reachable.yml
  vars:
    health_area: openstack
    health_sudo_check: true
    health_needs_root: true

- name: Containers | list containers
  ansible.builtin.command: docker ps -a --format json
  register: health_docker
  changed_when: false
  failed_when: false
  check_mode: false

- name: Containers | record results
  ansible.builtin.set_fact:
    health_results: >-
      {{ health_results | default([]) + [
           {'area': 'openstack', 'check': 'containers',
            'status': 'PASS' if (health_docker.rc == 0 and _containers | length > 0 and _bad | length == 0) else 'FAIL',
            'detail': ('docker failed: ' ~ health_docker.stderr | default('')) if health_docker.rc != 0
                      else (('not healthy: ' ~ (_bad | join(', '))) if _bad
                            else ((_containers | length) ~ ' running'))}
         ] }}
  vars:
    _containers: >-
      {{ (health_docker.stdout_lines | default([]) | map('from_json') | list) if health_docker.rc == 0 else [] }}
    _bad: >-
      {{ (_containers | rejectattr('State', 'equalto', 'running') | map(attribute='Names') | list)
         + (_containers | selectattr('Status', 'search', 'unhealthy') | map(attribute='Names') | list) }}
